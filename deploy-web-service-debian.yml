---
- name: HPE Morpheus Demo - Deploy Web Service & Readiness Dashboard
  hosts: all
  become: true
  gather_facts: true

  vars:
    web_port: 80
    web_root: /var/www/html
    audit_json_path: /tmp/morpheus_demo/final_audit_report.json
    target_ip: "{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) | default('127.0.0.1') }}"

  tasks:
    - name: Ensure apt cache is updated and Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Check if previous Morpheus Audit JSON exists
      ansible.builtin.stat:
        path: "{{ audit_json_path }}"
      register: audit_file_stat

    - name: Read previous Morpheus Audit JSON content if available
      ansible.builtin.slurp:
        src: "{{ audit_json_path }}"
      register: slurped_audit
      when: audit_file_stat.stat.exists

    - name: Parse Audit JSON facts
      ansible.builtin.set_fact:
        morpheus_audit: "{{ (slurped_audit.content | b64decode | from_json) if audit_file_stat.stat.exists else {'workflow_status': 'PASSED (ANSIBLE STANDALONE)'} }}"

    - name: Deploy HPE Morpheus Demo HTML Landing Page
      ansible.builtin.copy:
        dest: "{{ web_root }}/index.html"
        owner: www-data
        group: www-data
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>HPE Morpheus - Workload Provisioned</title>
            <style>
              :root {
                --hpe-green: #01a982;
                --bg-dark: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border: #334155;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: radial-gradient(circle at top right, #132a2e, var(--bg-dark) 60%);
                color: var(--text-main);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
              }
              .container {
                max-width: 820px;
                width: 100%;
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-top: 4px solid var(--hpe-green);
                border-radius: 12px;
                padding: 2.5rem;
                box-shadow: 0 20px 40px rgba(0,0,0,0.45);
              }
              .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid var(--border);
                padding-bottom: 1.5rem;
                margin-bottom: 1.75rem;
              }
              .brand {
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 0.12em;
                color: var(--hpe-green);
                font-weight: 700;
                margin-bottom: 0.35rem;
              }
              h1 { font-size: 1.65rem; font-weight: 600; }
              .badge {
                background: rgba(1, 169, 130, 0.15);
                color: #34d399;
                border: 1px solid var(--hpe-green);
                padding: 0.45rem 1rem;
                border-radius: 999px;
                font-size: 0.85rem;
                font-weight: 600;
              }
              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 1rem;
                margin-bottom: 1.75rem;
              }
              .metric {
                background: rgba(15, 23, 42, 0.65);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1rem 1.25rem;
              }
              .metric-label {
                font-size: 0.78rem;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--text-muted);
                margin-bottom: 0.4rem;
              }
              .metric-value {
                font-size: 1.05rem;
                font-weight: 600;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                color: #e2e8f0;
              }
              .footer {
                display: flex;
                justify-content: space-between;
                font-size: 0.82rem;
                color: var(--text-muted);
                border-top: 1px solid var(--border);
                padding-top: 1.25rem;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="header">
                <div>
                  <div class="brand">HPE Morpheus Enterprise Automation</div>
                  <h1>Workload Provisioning Complete</h1>
                </div>
                <div class="badge">● {{ morpheus_audit.workflow_status | default('ONLINE') }}</div>
              </div>

              <div class="grid">
                <div class="metric">
                  <div class="metric-label">Hostname / FQDN</div>
                  <div class="metric-value">{{ ansible_fqdn }}</div>
                </div>
                <div class="metric">
                  <div class="metric-label">IPv4 Endpoint</div>
                  <div class="metric-value">http://{{ target_ip }}</div>
                </div>
                <div class="metric">
                  <div class="metric-label">Operating System</div>
                  <div class="metric-value">{{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_distribution_release }})</div>
                </div>
                <div class="metric">
                  <div class="metric-label">Linux Kernel</div>
                  <div class="metric-value">{{ ansible_kernel }}</div>
                </div>
                <div class="metric">
                  <div class="metric-label">Compute Resources</div>
                  <div class="metric-value">{{ ansible_processor_vcpus }} vCPU / {{ (ansible_memtotal_mb / 1024) | round(1) }} GB RAM</div>
                </div>
                <div class="metric">
                  <div class="metric-label">Web Server Engine</div>
                  <div class="metric-value">Nginx (Port {{ web_port }})</div>
                </div>
              </div>

              <div class="footer">
                <span>Provisioned via Ansible Playbook Task</span>
                <span>Timestamp (UTC): {{ ansible_date_time.iso8601 }}</span>
              </div>
            </div>
          </body>
          </html>

    - name: Ensure Nginx service is enabled and started
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify local HTTP 200 response from Nginx
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ web_port }}"
        status_code: 200
      register: http_check

    - name: Display Fancy Demo Access Output
      ansible.builtin.debug:
        msg:
          - "=========================================================================="
          - "   HPE MORPHEUS DEMO - WEB SERVICE DEPLOYMENT SUCCESSFUL                  "
          - "=========================================================================="
          - "   Target Hostname : {{ ansible_fqdn }}"
          - "   Operating System: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_distribution_release }})"
          - "   Service Status  : Nginx Active (HTTP {{ http_check.status }} OK)"
          - "   Audit Status    : {{ morpheus_audit.workflow_status | default('READY') }}"
          - "--------------------------------------------------------------------------"
          - "   >>> CLICK TO OPEN DEMO WEB PORTAL: http://{{ target_ip }} <<<"
          - "=========================================================================="
